name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly retrieval quality check
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rules:
    name: Copy and UI rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-rules.mjs

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0
        ports: ["12111:12111"]
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_PG_SUPERUSER: postgres:postgres
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Bootstrap database roles
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -v owner_password=docent_owner \
            -v app_password=docent_app -v worker_password=docent_worker -f infra/db/sql/roles.sql
          psql -d postgres -c "create database docent_test owner docent_owner"
          psql -d docent_test -v ON_ERROR_STOP=1 -f infra/db/sql/database.sql
      - name: Install
        working-directory: apps/api
        run: uv sync --locked
      - name: Lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        working-directory: apps/api
        run: uv run mypy
      - name: Tests
        working-directory: apps/api
        run: uv run pytest
      - name: OpenAPI schema is committed and current
        run: |
          uv run --directory apps/api docent openapi > /tmp/openapi.json
          diff -u packages/api-client/openapi.json /tmp/openapi.json

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm --filter @docent/api-client generate
          git diff --exit-code packages/api-client/src/schema.d.ts
      - name: Signing examples in the install guide are current
        run: node scripts/gen-signing-examples.mjs --check
      - run: pnpm -r typecheck
      - name: Widget tests and loader size budget
        run: |
          pnpm --filter @docent/widget test
          pnpm --filter @docent/widget build
          pnpm --filter @docent/widget size
      - run: pnpm --filter @docent/web lint
      - run: pnpm --filter @docent/web build

  e2e:
    name: End to end on the Docker stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and start every service from the production images
        env:
          OLLAMA_BASE_URL: http://ollama:11434
        run: |
          docker compose --profile app --profile ollama up -d --build --wait
          docker compose exec -T ollama ollama pull embeddinggemma
      - name: Backup image builds
        run: docker build -f infra/docker/backup.Dockerfile -t docent-backup:ci .
      - run: pnpm --filter @docent/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Widget end to end on a demo customer site (Chromium and WebKit)
        run: |
          pnpm --filter @docent/widget exec playwright install --with-deps chromium webkit
          pnpm --filter @docent/widget e2e
      - name: Service logs
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200

  retrieval:
    name: Retrieval quality (real embedding model)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://docent_app:docent_app@127.0.0.1:5432/docent
      WORKER_DATABASE_URL: postgresql://docent_worker:docent_worker@127.0.0.1:5432/docent
      MIGRATION_DATABASE_URL: postgresql://docent_owner:docent_owner@127.0.0.1:5432/docent
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Bootstrap database
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -v owner_password=docent_owner \
            -v app_password=docent_app -v worker_password=docent_worker -f infra/db/sql/roles.sql
          psql -d postgres -c "create database docent owner docent_owner"
          psql -d docent -v ON_ERROR_STOP=1 -f infra/db/sql/database.sql
          uv run --directory apps/api docent db migrate
      - name: Install Ollama and the embedding model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull embeddinggemma
      - name: Recall at 8 must stay at or above 0.85
        run: uv run --directory apps/api docent eval retrieval --out "$RUNNER_TEMP/retrieval.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: retrieval-report
          path: ${{ runner.temp }}/retrieval.json

  agent-gate:
    name: Agent quality gate (platform golden set)
    # Needs a chat model. Turn it on with the repository variables
    # EVAL_LLM_BASE_URL and EVAL_LLM_MODEL and the secret EVAL_LLM_API_KEY. It runs
    # nightly, and on pull requests that change prompts, models, chunking, or
    # retrieval. It fails when the wrong-answer rate rises more than 2 points
    # over fixtures/golden/baseline.json, escalation recall falls, or a safety case fails.
    if: vars.EVAL_LLM_BASE_URL != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://docent_app:docent_app@127.0.0.1:5432/docent
      WORKER_DATABASE_URL: postgresql://docent_worker:docent_worker@127.0.0.1:5432/docent
      MIGRATION_DATABASE_URL: postgresql://docent_owner:docent_owner@127.0.0.1:5432/docent
      LLM_BASE_URL: ${{ vars.EVAL_LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.EVAL_LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did this change touch the agent?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -qE '^(apps/api/src/docent/(agent/|llm/|config\.py|knowledge/(chunking|search|embeddings)\.py)|fixtures/golden/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v10
        if: steps.scope.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Bootstrap database
        if: steps.scope.outputs.run == 'true'
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -v owner_password=docent_owner \
            -v app_password=docent_app -v worker_password=docent_worker -f infra/db/sql/roles.sql
          psql -d postgres -c "create database docent owner docent_owner"
          psql -d docent -v ON_ERROR_STOP=1 -f infra/db/sql/database.sql
          uv run --directory apps/api docent db migrate
      - name: Install Ollama and the embedding model
        if: steps.scope.outputs.run == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama pull embeddinggemma
      - name: Run the golden set through the agent
        if: steps.scope.outputs.run == 'true'
        run: uv run --directory apps/api docent eval agent --sample 8 --out "$RUNNER_TEMP/agent.json"
      - name: Compare with the baseline
        if: steps.scope.outputs.run == 'true'
        run: uv run --directory apps/api docent eval gate --report "$RUNNER_TEMP/agent.json"
      - uses: actions/upload-artifact@v7
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: agent-report
          path: ${{ runner.temp }}/agent.json
